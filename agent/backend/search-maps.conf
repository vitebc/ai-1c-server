# search-maps v2: сервер=база1,база2 (hot-reload, TTL 2с).
# Управляется из админки (Agent Studio › Search-мапа), ручные правки на хосте переживают деплой.
# База упомянута в >=1 строке сервера — видит только эти серверы. Явный запрет — '!база='.
# База не упомянута нигде — список из '*' (пустая '*' = блок для всех прочих), без '*' — без фильтрации.

;
search-ka-rs=ca2_otchet_zhvv,ca2_update_zhvv;
search-obrabotki=ca2_update,ca2_ai,doc3_test;